server:
  port: 8084

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/ridelink_fare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ride
    password: ride123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ridelink-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000

# ---- Fare calculation rules (documented business rule) ----
# total = baseFare + (distanceKm × ratePerKm) + (waitingMinutes × waitingChargePerMin)
# serviceFee = subtotal × serviceFeePercent / 100
# finalTotal = subtotal + serviceFee
fare:
  base-fare: 300.00                 # LKR — flat base fare
  rate-per-km: 80.00                # LKR per kilometre
  waiting-charge-per-min: 5.00      # LKR per minute of waiting
  service-fee-percent: 5.0          # 5% platform fee

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ridelink.payment_service: DEBUG