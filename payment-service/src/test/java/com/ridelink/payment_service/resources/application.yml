spring:
  datasource:
    url: jdbc:h2:mem:paydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: ridelink-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000

fare:
  base-fare: 300.0
  rate-per-km: 100.0
  waiting-charge-per-min: 5.0
  service-fee-percent: 2.0